<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOD House Of Deva | Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0b0d;
            --surface: #0f1114;
            --muted: #9aa0a6;
            --gold1: #d4af37;
            --gold2: #ffcc66;
            --accent: linear-gradient(90deg, var(--gold1), var(--gold2));
            --glass: rgba(255, 255, 255, 0.03);
            --card-radius: 16px;
            --shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
            --maxw: 1200px;
            --gap: 20px;
            --ff-heading: 'Playfair Display', serif;
            --ff-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --orange: #ff9800;
            --green: #4CAF50;
        }

        body {
            background: radial-gradient(1200px 600px at 10% 10%, rgba(212, 175, 55, 0.06), transparent 6%),
                        radial-gradient(1000px 500px at 95% 90%, rgba(255, 204, 102, 0.04), transparent 8%),
                        var(--bg);
            color: #e8e6e3;
            font-family: var(--ff-ui);
            padding: 16px;
            display: flex;
            justify-content: center;
            line-height: 1.5;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('bg.png') no-repeat center center/cover;
            filter: grayscale(100%);
            opacity: 0.25;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: var(--maxw);
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }

        /* Cafe Header */
        .cafe-header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 0;
        }

        .cafe-name {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--gold1);
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
            line-height: 1;
            margin-bottom: 5px;
            position: relative;
            display: inline-block;
        }

        .cafe-name::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 2px;
            background: var(--gold1);
        }

        .cafe-subtitle {
            font-size: 1.2rem;
            color: var(--orange);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 10px;
        }

        .mobile-numbers {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.05rem;
            margin: 12px 0;
        }

        .veg-nonveg {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        .veg {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 30px;
            background: rgba(46, 125, 50, 0.1);
            color: #2e7d32;
        }

        .symbol {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4caf50;
            border: 2px solid #2e7d32;
        }

        /* Search & Tabs */
        .controls {
            margin-bottom: 20px;
        }

        .search {
            background: var(--glass);
            backdrop-filter: blur(6px);
            padding: 12px 16px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 15px;
            width: 100%;
        }

        .tabs-scroll {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .tab {
            padding: 10px 20px;
            border-radius: 999px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 14px;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .tab.active {
            background: var(--accent);
            color: #0b0b0d;
            border: none;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.005));
            border-radius: 20px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            display: flex;
            gap: 14px;
            margin-bottom: 12px;
        }

        .thumb {
            width: 100px;
            height: 100px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            background: rgba(255,255,255,0.02);
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            flex: 1;
        }

        .dish {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
            font-family: var(--ff-heading);
        }

        .desc {
            font-size: 0.75rem;
            color: var(--muted);
            margin: 4px 0;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0 4px;
        }

        .pill {
            background: rgba(255,255,255,0.03);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 10px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 12px;
        }

        .price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold2);
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--gold1), var(--gold2));
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 700;
            color: #0b0b0d;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        /* Cart Button */
        .cart-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 200;
        }

        .cart-button {
            background: var(--accent);
            width: 62px;
            height: 62px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e67e22;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }

        /* Modal */
        .cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 8, 12, 0.96);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.25s ease;
            padding: 16px;
        }

        .cart-modal.open {
            opacity: 1;
            visibility: visible;
        }

        .cart-content {
            background: var(--surface);
            width: 100%;
            max-width: 550px;
            max-height: 85vh;
            border-radius: 24px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .cart-title {
            font-family: var(--ff-heading);
            font-size: 1.6rem;
            color: var(--gold2);
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--muted);
            cursor: pointer;
        }

        .cart-items {
            margin: 16px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .item-info {
            flex: 2;
        }

        .item-name {
            font-weight: 600;
        }

        .item-price {
            color: var(--gold1);
            font-size: 0.85rem;
        }

        .item-quantity {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity-btn {
            background: rgba(255,255,255,0.06);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .remove-item {
            background: none;
            border: none;
            color: #e67e22;
            font-size: 20px;
            cursor: pointer;
            margin-left: 8px;
        }

        .cart-empty {
            text-align: center;
            padding: 28px;
            color: var(--muted);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 15px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 10px;
        }

        .total-amount {
            color: var(--gold2);
        }

        .delivery-options {
            background: rgba(255,255,255,0.02);
            padding: 16px;
            border-radius: 20px;
            margin: 16px 0;
        }

        .option-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 30px;
            color: var(--muted);
            cursor: pointer;
            margin-right: 12px;
        }

        .option-btn.active {
            background: var(--accent);
            color: #0b0b0d;
            border-color: var(--gold1);
        }

        .delivery-form {
            margin-top: 16px;
            display: none;
        }

        .delivery-form.active {
            display: block;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            margin: 8px 0;
        }

        .customer-details-summary {
            background: rgba(212, 175, 55, 0.08);
            padding: 14px;
            border-radius: 16px;
            margin: 12px 0;
            display: none;
        }

        .customer-details-summary.active {
            display: block;
        }

        .cart-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .btn-whatsapp {
            background: #25D366;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-clear {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px;
            border-radius: 40px;
            color: var(--muted);
            cursor: pointer;
        }

        .location-link-section {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            margin-top: 30px;
        }

        .map-link {
            display: inline-flex;
            background: var(--accent);
            padding: 12px 28px;
            border-radius: 40px;
            color: #0b0b0d;
            text-decoration: none;
            font-weight: 700;
            margin-top: 10px;
            gap: 8px;
        }

        .qr-section {
            background: #ffffff;
            padding: 20px;
            border-radius: 28px;
            text-align: center;
            margin-top: 25px;
        }

        .qr-section img {
            width: 180px;
            margin: 10px;
        }

        @media (max-width: 550px) {
            .cafe-name { font-size: 2.4rem; }
            .cart-content { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="cart-container">
    <button class="cart-button" id="cartButton">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="cart-count" id="cartCount">0</span>
    </button>
</div>

<div class="container">
    <div class="cafe-header">
        <img src="logo.png" alt="HOD Logo" style="width:220px; margin:0 auto; display:block;">
        <div class="cafe-name">HOD</div>
        <div class="cafe-subtitle">HOUSE OF DEVA</div>
        <div class="mobile-numbers">📞 Mo no. +91 83788 20893</div>
        <div class="veg-nonveg">
            <div class="veg"><span class="symbol"></span> PURE VEG</div>
        </div>
    </div>

    <div class="controls">
        <div class="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>
            <input id="search" placeholder="Search samosa, misal, tea..." />
        </div>
        <div class="tabs-scroll" id="tabsContainer">
            <button class="tab active" data-cat="all">🍽️ All Items</button>
            <button class="tab" data-cat="Breakfast & Snacks">🥞 Breakfast & Snacks</button>
            <button class="tab" data-cat="Beverages">☕ Beverages</button>
        </div>
    </div>

    <div class="menu-grid" id="menuGrid"></div>

    <!-- location and QR -->
    <div class="location-link-section">
        <h3 style="color:var(--gold2);">📍 Find Us</h3>
        <a href="https://maps.app.goo.gl/BELej8egSJ8PQaZ38" target="_blank" class="map-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Google Maps
        </a>
        <div class="qr-section">
            <h4 style="color:#6a1b9a;">PhonePe | Vaibhav Trading Company</h4>
            <img src="paymentqr.jpeg" alt="QR Code" style="width:160px; border-radius:16px;">
            <p>Scan & Pay via UPI</p>
            <a href="upi://pay?pa=vaibhavsontakke69@ybl&pn=Vaibhav Trading Company&cu=INR" style="display:inline-block; background:#6a1b9a; color:white; padding:8px 20px; border-radius:40px; text-decoration:none;">Pay Now</a>
        </div>
    </div>
</div>

<!-- Cart Modal -->
<div class="cart-modal" id="cartModal">
    <div class="cart-content">
        <div class="cart-header">
            <h3 class="cart-title">📋 Your Order</h3>
            <button class="close-cart" id="closeCartBtn">✕</button>
        </div>

        <div class="delivery-options">
            <h4>🚚 Delivery Type</h4>
            <div>
                <button class="option-btn active" id="optRestaurant">🏠 Dine-in</button>
                <button class="option-btn" id="optHome">🏡 Home Delivery</button>
            </div>
            <div id="restaurantForm" class="delivery-form active">
                <input type="text" id="tableNumber" class="form-input" placeholder="Table number (e.g., Table 4)">
            </div>
            <div id="homeForm" class="delivery-form">
                <input type="text" id="custName" class="form-input" placeholder="Full name">
                <input type="tel" id="custMobile" class="form-input" placeholder="Mobile number">
                <textarea id="custAddress" class="form-input" rows="2" placeholder="Delivery address"></textarea>
            </div>
        </div>

        <div id="customerSummary" class="customer-details-summary"></div>

        <div id="cartItemsList" class="cart-items">
            <div class="cart-empty" id="cartEmptyMsg">🛒 Cart is empty</div>
        </div>

        <div class="cart-total">
            <span>Total Amount:</span>
            <span class="total-amount" id="finalTotal">₹0</span>
        </div>

        <div class="cart-actions">
            <button id="addAnotherItemBtn" style="background:rgba(212,175,55,0.1); border:1px solid rgba(212,175,55,0.3); padding:12px; border-radius:40px; color:var(--gold2); font-weight:bold;">➕ Add another Item</button>
            <button id="clearCartBtn" class="btn-clear">🗑️ Clear Cart</button>
            <button id="whatsappBtn" class="btn-whatsapp">💬 Order via WhatsApp</button>
        </div>
    </div>
</div>

<script>
    // ---------- MENU DATA (FIXED PRICES) ----------
    const menuData = [
        { id: 1, cat: "Breakfast & Snacks", name: "Puri Bhaji | पुरी भाजी", price: 30, priceText: "₹30", desc: "Hot Puris & Spicy Vegetable Curry.", tags: ["Veg", "Breakfast"], img: "img/puri_bhaji.jpg" },
        { id: 2, cat: "Breakfast & Snacks", name: "Vada Pav | वडापाव", price: 20, priceText: "₹20", desc: "The Heart of Maharashtra.", tags: ["Veg", "Snacks"], img: "img/vada_pav.jpg" },
        { id: 3, cat: "Breakfast & Snacks", name: "Misal Pav | मिसळ", price: 60, priceText: "₹60", desc: "Spicy Kolhapuri Misal Pav.", tags: ["Veg", "Spicy"], img: "img/misal_pav.jpg" },
        { id: 4, cat: "Beverages", name: "Special Ginger Tea | चहा", price: 10, priceText: "₹10", desc: "Special Ginger Tea.", tags: ["Veg", "Hot Beverage"], img: "img/ginger_tea.jpg" },
        { id: 5, cat: "Breakfast & Snacks", name: "Bhaji Pav | भजी पाव", price: 25, priceText: "₹25", desc: "Crispy Onion Fritters with Pav.", tags: ["Veg", "Snacks"], img: "img/bhaji_pav.jpg" },
        { id: 6, cat: "Breakfast & Snacks", name: "Samosa | समोसा", price: 15, priceText: "₹15", desc: "Spicy Samosa & Chutney.", tags: ["Veg", "Snacks"], img: "img/samosa.jpg" },
        { id: 7, cat: "Breakfast & Snacks", name: "Sabudana Khichdi", price: 40, priceText: "₹40", desc: "Spicy Sabudana & Potato Khichdi.", tags: ["Veg", "Fasting"], img: "img/sabudana_khichdi.jpg" },
        { id: 8, cat: "Breakfast & Snacks", name: "Sheera | शिरा", price: 30, priceText: "₹30", desc: "Hot Sheera made with pure ghee.", tags: ["Veg", "Sweet"], img: "img/sheera.jpg" },
        { id: 9, cat: "Breakfast & Snacks", name: "Kanda Pohe | कांदापोहे", price: 20, priceText: "₹20", desc: "Kandapohe with Onion, Lemon.", tags: ["Veg", "Breakfast"], img: "img/kanda_pohe.jpg" }
    ];

    // Cart state
    let cart = [];
    let deliveryType = "restaurant";

    // DOM elements
    const menuGrid = document.getElementById("menuGrid");
    const searchInput = document.getElementById("search");
    const cartCountSpan = document.getElementById("cartCount");
    const cartModalDiv = document.getElementById("cartModal");
    const cartItemsContainer = document.getElementById("cartItemsList");
    const cartEmptyMsgDiv = document.getElementById("cartEmptyMsg");
    const finalTotalSpan = document.getElementById("finalTotal");
    const clearCartBtn = document.getElementById("clearCartBtn");
    const whatsappBtn = document.getElementById("whatsappBtn");
    const addAnotherBtn = document.getElementById("addAnotherItemBtn");
    const closeCartBtn = document.getElementById("closeCartBtn");
    const cartButton = document.getElementById("cartButton");
    const optRestaurant = document.getElementById("optRestaurant");
    const optHome = document.getElementById("optHome");
    const restaurantFormDiv = document.getElementById("restaurantForm");
    const homeFormDiv = document.getElementById("homeForm");
    const customerSummaryDiv = document.getElementById("customerSummary");

    // Input fields
    const tableNumberInput = document.getElementById("tableNumber");
    const custNameInput = document.getElementById("custName");
    const custMobileInput = document.getElementById("custMobile");
    const custAddressInput = document.getElementById("custAddress");

    // Helper: update cart UI, total, badge
    function updateCartUI() {
        // update badge count
        const totalQty = cart.reduce((sum, i) => sum + i.quantity, 0);
        cartCountSpan.innerText = totalQty;

        // Render cart items
        if (cart.length === 0) {
            cartItemsContainer.innerHTML = `<div class="cart-empty" id="cartEmptyMsg">🛒 Your cart is empty</div>`;
            finalTotalSpan.innerText = "₹0";
            return;
        }

        let itemsHtml = "";
        let totalRupees = 0;
        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            totalRupees += itemTotal;
            itemsHtml += `
                <div class="cart-item" data-id="${item.id}">
                    <div class="item-info">
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        <div class="item-price">₹${item.price}</div>
                    </div>
                    <div class="item-quantity">
                        <button class="quantity-btn" onclick="window.changeQty(${item.id}, -1)">−</button>
                        <span style="min-width:24px; text-align:center;">${item.quantity}</span>
                        <button class="quantity-btn" onclick="window.changeQty(${item.id}, 1)">+</button>
                        <button class="remove-item" onclick="window.removeCartItem(${item.id})">✕</button>
                    </div>
                </div>
            `;
        });
        cartItemsContainer.innerHTML = itemsHtml;
        finalTotalSpan.innerText = `₹${totalRupees}`;
        updateCustomerSummary();
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // Add to cart
    function addToCart(item, btnElement) {
        const existing = cart.find(i => i.id === item.id);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({ id: item.id, name: item.name, price: item.price, quantity: 1 });
        }
        updateCartUI();

        // Button animation
        if (btnElement) {
            const originalHtml = btnElement.innerHTML;
            btnElement.innerHTML = "✓ Added";
            btnElement.style.opacity = "0.8";
            setTimeout(() => {
                btnElement.innerHTML = originalHtml;
                btnElement.style.opacity = "1";
            }, 800);
        }
    }

    window.changeQty = function(id, delta) {
        const idx = cart.findIndex(i => i.id === id);
        if (idx !== -1) {
            const newQty = cart[idx].quantity + delta;
            if (newQty <= 0) {
                cart.splice(idx, 1);
            } else {
                cart[idx].quantity = newQty;
            }
            updateCartUI();
        }
    };

    window.removeCartItem = function(id) {
        cart = cart.filter(i => i.id !== id);
        updateCartUI();
    };

    clearCartBtn.addEventListener("click", () => {
        cart = [];
        updateCartUI();
    });

    // Delivery logic
    function setDeliveryType(type) {
        deliveryType = type;
        if (type === "restaurant") {
            optRestaurant.classList.add("active");
            optHome.classList.remove("active");
            restaurantFormDiv.classList.add("active");
            homeFormDiv.classList.remove("active");
        } else {
            optHome.classList.add("active");
            optRestaurant.classList.remove("active");
            homeFormDiv.classList.add("active");
            restaurantFormDiv.classList.remove("active");
        }
        updateCustomerSummary();
    }

    function updateCustomerSummary() {
        let summaryHtml = "";
        let hasData = false;
        if (deliveryType === "restaurant") {
            const table = tableNumberInput.value.trim();
            if (table) {
                hasData = true;
                summaryHtml = `<div style="font-size:14px;">🍽️ Dine-in | Table: ${escapeHtml(table)}</div>`;
            }
        } else {
            const name = custNameInput.value.trim();
            const mob = custMobileInput.value.trim();
            const addr = custAddressInput.value.trim();
            if (name || mob || addr) {
                hasData = true;
                summaryHtml = `<div><strong>🏠 Delivery</strong><br>${name ? `Name: ${escapeHtml(name)}<br>` : ''}${mob ? `Mobile: ${escapeHtml(mob)}<br>` : ''}${addr ? `Address: ${escapeHtml(addr)}` : ''}</div>`;
            }
        }
        if (hasData) {
            customerSummaryDiv.innerHTML = `<div class="summary-title" style="color:var(--gold2); margin-bottom:6px;">✅ Customer Details</div>${summaryHtml}`;
            customerSummaryDiv.classList.add("active");
        } else {
            customerSummaryDiv.classList.remove("active");
        }
    }

    optRestaurant.addEventListener("click", () => setDeliveryType("restaurant"));
    optHome.addEventListener("click", () => setDeliveryType("home"));
    [tableNumberInput, custNameInput, custMobileInput, custAddressInput].forEach(inp => {
        if(inp) inp.addEventListener("input", updateCustomerSummary);
    });

    // WhatsApp order
    whatsappBtn.addEventListener("click", () => {
        if (cart.length === 0) {
            alert("Cart is empty! Add some delicious items.");
            return;
        }
        if (deliveryType === "restaurant") {
            const table = tableNumberInput.value.trim();
            if (!table) {
                alert("Please enter table number for dine-in");
                return;
            }
        } else {
            const name = custNameInput.value.trim();
            const mobile = custMobileInput.value.trim();
            const address = custAddressInput.value.trim();
            if (!name || !mobile || !address) {
                alert("Please fill Name, Mobile & Address for home delivery");
                return;
            }
        }

        let message = `🍽️ *HOD House Of Deva Order* 🍽️\n`;
        if (deliveryType === "restaurant") {
            message += `📍 Dine-in | Table: ${tableNumberInput.value.trim()}\n`;
        } else {
            message += `🚚 Home Delivery\n👤 ${custNameInput.value.trim()}\n📞 ${custMobileInput.value.trim()}\n🏠 ${custAddressInput.value.trim()}\n`;
        }
        message += `\n📋 *Items:*\n`;
        let total = 0;
        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            message += `• ${item.name} x ${item.quantity} = ₹${itemTotal}\n`;
        });
        message += `\n💰 *Total: ₹${total}*\n🙏 Thank you!`;
        const encodedMsg = encodeURIComponent(message);
        window.open(`https://wa.me/918378820893?text=${encodedMsg}`, '_blank');
        cartModalDiv.classList.remove("open");
    });

    // Modal toggles
    cartButton.addEventListener("click", () => {
        cartModalDiv.classList.add("open");
        updateCustomerSummary();
    });
    closeCartBtn.addEventListener("click", () => cartModalDiv.classList.remove("open"));
    addAnotherBtn.addEventListener("click", () => {
        cartModalDiv.classList.remove("open");
        document.getElementById("search")?.focus();
    });

    // Render Menu
    function renderMenu(itemsArray) {
        if (!itemsArray.length) {
            menuGrid.innerHTML = `<p style="grid-column:1/-1; text-align:center;">No items found</p>`;
            return;
        }
        menuGrid.innerHTML = itemsArray.map(item => `
            <div class="card">
                <div class="card-header">
                    <div class="thumb">
                        <img src="${item.img}" alt="${item.name}" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%22%20height%3D%22100%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23222%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%23aaa%22%3EFood%3C%2Ftext%3E%3C%2Fsvg%3E'">
                    </div>
                    <div class="card-info">
                        <h3 class="dish">${item.name}</h3>
                        <p class="desc">${item.desc}</p>
                        <div class="tags">${item.tags.map(t => `<span class="pill">${t}</span>`).join('')}</div>
                    </div>
                </div>
                <div class="card-footer">
                    <span class="price">${item.priceText}</span>
                    <button class="btn-primary" data-id="${item.id}" data-name="${item.name}" data-price="${item.price}">Add to Cart</button>
                </div>
            </div>
        `).join('');

        // attach events to new buttons
        document.querySelectorAll(".btn-primary").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute("data-id"));
                const name = btn.getAttribute("data-name");
                const price = parseInt(btn.getAttribute("data-price"));
                const originalItem = menuData.find(i => i.id === id);
                if (originalItem) {
                    addToCart(originalItem, btn);
                } else {
                    addToCart({ id, name, price, priceText: `₹${price}` }, btn);
                }
            });
        });
    }

    // Filter + search
    let currentFilter = "all";
    function filterAndRender() {
        let filtered = [...menuData];
        if (currentFilter !== "all") {
            filtered = filtered.filter(item => item.cat === currentFilter);
        }
        const query = searchInput.value.trim().toLowerCase();
        if (query) {
            filtered = filtered.filter(item => item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query) || item.tags.some(t => t.toLowerCase().includes(query)));
        }
        renderMenu(filtered);
    }

    // Tabs
    document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            currentFilter = tab.getAttribute("data-cat");
            filterAndRender();
        });
    });

    searchInput.addEventListener("input", () => filterAndRender());

    // initial render
    filterAndRender();
    updateCartUI();
    setDeliveryType("restaurant");
</script>
</body>
</html>
